name: Deploy Firebase Hosting Preview on Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  verify_and_preview:
    name: Verify Build & Deploy PR Preview Channel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters

      - name: Run ESLint security rules check
        run: npx eslint .

      - name: Build production Vite & PWA bundle
        run: npm run build

      - name: Deploy Firebase Hosting Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0175021821 }}
          projectId: gen-lang-client-0175021821
